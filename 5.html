<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>জল.সার নাটক</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Sony LIV Inspired Palette */
      --bg-base: #000000;
      --liv-gold: #FFC107;
      --liv-cyan: #00E5FF;
      --liv-purple: #8A2BE2;
      --liv-orange: #FF4500;
      --glass-bg: rgba(15, 15, 20, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
    }

    body {
      font-family: 'Poppins', 'Hind Siliguri', 'SolaimanLipi', sans-serif;
      background-color: var(--bg-base);
      /* Vibrant background gradients inspired by the Sony LIV wave */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 69, 0, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Navigation with Gradient Accent Border */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--liv-cyan), var(--liv-purple), var(--liv-orange)) 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      margin: 25px auto;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 90%;
      max-width: 750px;
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 4px;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .navbar a:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .navbar a.active {
      color: #000000;
      background: var(--liv-gold);
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
    }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      width: 100%;
    }

    /* Frosted Glass Container */
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      text-align: center;
      max-width: 550px;
      width: 100%;
    }

    h1 {
      font-size: 26px;
      color: var(--text-main);
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-badge {
      color: #000;
      background-color: var(--liv-gold);
      font-weight: 700;
      margin-right: 12px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(255, 193, 7, 0.3);
    }

    /* Video Links (Cinematic Button Cards) */
    .video-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-link {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      background-color: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 20px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .video-link:hover {
      background-color: var(--liv-gold);
      color: #000000;
      transform: translateY(-3px); /* Smooth lift effect */
      box-shadow: 0 6px 20px rgba(255, 193, 7, 0.25);
      border-color: var(--liv-gold);
    }

    /* Minimalist Footer */
    .footer {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
    }

    .footer p {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    /* Mobile Responsiveness */
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 20px;
      }

      .navbar {
        width: 95%;
        padding: 8px;
        overflow-x: auto;
        justify-content: flex-start;
        -ms-overflow-style: none;
      }
      
      .navbar::-webkit-scrollbar {
        display: none; 
      }

      .navbar a {
        white-space: nowrap;
        font-size: 13px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation with Specific URLs -->
  <nav class="navbar">
    <a href="https://faruk90scinet.github.io/movie">Channel 1</a>
    <a href="https://faruk90scinet.github.io/movie/2">Channel 2</a>
    <a href="https://faruk90scinet.github.io/movie/3">Channel 3</a>
    <a href="https://faruk90scinet.github.io/movie/4">Channel 4</a>
    <a href="https://faruk90scinet.github.io/movie/5">জলসা</a>
  </nav>

  <main class="main">
    <div class="container">
      <h1><span class="brand-badge">FMZ</span> 📽️ জল.সার নাটক - 31-08-26 (29,31)</h1>
      <div class="video-list">
        <a class="video-link" href="https://www.blogger.com/video.g?token=AD6v5dwIkX0b8lhToSW6aftfuH4EjfBG_NR4_XLDuFI8kQLoR2oqBQ_GPa8WWim_w7kFIz2UmgJX617SCwIMq3HI0YCXUXMwoSPosLq7IqHy0BMGaMwIPMT6lZJdsDhKiBXAT4lXuA&origin=www.niyogbd.xyz" target="_blank">পর.শুরাম</a>
        <a class="video-link" href="https://www.blogger.com/video.g?token=AD6v5dxDe-leD0ES2I-cT4hRdPRmAg714RpPbTcPHAn3u9y9hTkJ2ofllZUwyYCQ3e_Xvhg2v_HlmZSvfbvnTq6y8YiDjVIC6OwjWmZ2vE8kIh7Cf-oEzsPCk4-XBiKYHjdae5H-ylXP&origin=www.niyogbd.xyz" target="_blank">প্রফে.সর বি.দ্যা</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© Faruk's Movie Zone. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Logic to handle highlighting the active menu link
      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const links = document.querySelectorAll(".navbar a");

      links.forEach(link => {
        const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
        if (linkUrl === currentUrl) {
          link.classList.add("active");
        }
      });
    });
  </script>

</body>
</html>
