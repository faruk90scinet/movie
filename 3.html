<script>
    document.addEventListener("DOMContentLoaded", async function() {
      // 1. Identify which channel this page is for
      const channelId = "channel3"; // Change to "channel2", "channel3", etc. on other pages

      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const links = document.querySelectorAll(".navbar a");

      links.forEach(link => {
        const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
        if (linkUrl === currentUrl) {
          link.classList.add("active");
        }
      });

      function makeDirectLink(url) {
        if (!url) return '';
        return url.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "");
      }

      try {
        // Fetch the absolute URL so it works from any subfolder (/2, /3, /4)
        const response = await fetch('https://faruk90scinet.github.io/movie/movie-data.json');
        const allData = await response.json();
        
        // Grab only the data for this specific channel
        const data = allData[channelId];

        const videoSrc = makeDirectLink(data.videoLink);
        const subBn = makeDirectLink(data.subtitleBnLink);
        const subEn = makeDirectLink(data.subtitleEnLink);

        document.getElementById('movie-title').innerText = `🎬 Faruk's Movie Zone - ${data.title}`;

        const videoHTML = `
          <video controls crossorigin="anonymous">          
            <source src="${videoSrc}" type="video/mp4">
            ${subBn ? `<track kind="subtitles" src="${subBn}" srclang="bn" label="Bengali" default>` : ''}
            ${subEn ? `<track kind="subtitles" src="${subEn}" srclang="en" label="English">` : ''}
            Your browser does not support the video tag.
          </video>
        `;
        
        document.getElementById('video-container').innerHTML = videoHTML;

      } catch (error) {
        console.error("Error loading movie data:", error);
        document.getElementById('movie-title').innerText = "🎬 Error loading movie.";
      }
    });
  </script>
