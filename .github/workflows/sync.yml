name: Sync movies from Dropbox

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # "Run workflow" button for an instant update

permissions:
  contents: write
  pages: write

concurrency:
  group: dropbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare publishing
        run: |
          git config user.name "FMZ Sync"
          git config user.email "fmz-sync@users.noreply.github.com"
          cat > /tmp/publish.sh <<'SH'
          git add movie-data.json subs thumbs
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "$1"
          git pull --rebase -X ours || true
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 || true
          SH

      - name: 1) Show new movies on the site right away
        run: |
          node sync/sync.mjs --quick
          bash /tmp/publish.sh "New movies from Dropbox"

      - name: 2) Thumbnails and Bengali subtitles
        run: |
          node sync/sync.mjs
          bash /tmp/publish.sh "Thumbnails and subtitles"
