
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faruk's Movie Zone</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Sony LIV Inspired Palette */
      --bg-base: #000000;
      --liv-gold: #FFC107;
      --liv-cyan: #00E5FF;
      --liv-purple: #8A2BE2;
      --liv-orange: #FF4500;
      --glass-bg: rgba(15, 15, 20, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
    }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 69, 0, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.08) 0%, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Navigation */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--liv-cyan), var(--liv-purple), var(--liv-orange)) 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      margin: 25px auto;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 90%;
      max-width: 900px;
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 4px;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .navbar a:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .navbar a.active {
      color: #000000;
      background: var(--liv-gold);
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 2.5fr 1fr; 
      gap: 24px;
      width: 100%;
      max-width: 1300px;
      padding: 20px 30px 50px 30px;
      margin: 0 auto;
      flex: 1;
    }

    /* --- LEFT COLUMN: MAIN PLAYER --- */
    .main-player-col {
      display: flex;
      flex-direction: column;
    }

    .title-container {
      margin-bottom: 15px;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
    }

    .brand-badge {
      color: #000;
      background-color: var(--liv-gold);
      font-weight: 700;
      margin-right: 12px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(255, 193, 7, 0.3);
    }

    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #050505;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* --- NEW: Language Switcher Styles --- */
    .language-switcher {
      display: flex;
      gap: 12px;
      padding: 12px 15px;
      background: #050505;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      justify-content: center;
    }
    .lang-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    .lang-btn:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }
    .lang-btn.active {
      background: var(--liv-gold);
      color: #000;
      border-color: var(--liv-gold);
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
      border: 1px solid var(--liv-gold);
    }

    video {
      width: 100%;
      height: auto;
      display: block; 
      aspect-ratio: 16 / 9; 
      outline: none;
    }

    video::cue {
      background-color: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 1.3rem;
      font-family: 'Hind Siliguri', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,1);
    }

    /* --- RIGHT COLUMN: SIDEBAR --- */
    .sidebar-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 45px; 
    }

    .sidebar-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-decoration: none;
    }

    .sidebar-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #111, #1a1a24);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .sidebar-item:hover .sidebar-thumb {
      border-color: var(--liv-gold);
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.3);
      transform: scale(1.02);
    }

    .play-icon {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .sidebar-item:hover .play-icon {
      color: var(--liv-gold);
      transform: scale(1.1);
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      transition: color 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item:hover .sidebar-title {
      color: var(--liv-gold);
    }

    /* Minimalist Footer */
    .footer {
      width: 100%;
      padding: 30px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.6);
      margin-top: auto;
    }

    .footer p {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    /* --- MOBILE RESPONSIVENESS --- */
    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr; 
        padding: 10px 15px 40px 15px;
        gap: 30px;
      }
      .sidebar-col {
        padding-top: 10px;
        flex-direction: row; 
        overflow-x: auto;
        padding-bottom: 15px;
        -ms-overflow-style: none;
      }
      .sidebar-col::-webkit-scrollbar {
        display: none;
      }
      .sidebar-item {
        min-width: 200px; 
      }
    }

    @media (max-width: 600px) {
      .navbar {
        width: 95%;
        padding: 8px;
        overflow-x: auto;
        justify-content: flex-start;
        -ms-overflow-style: none;
      }
      .navbar::-webkit-scrollbar {
        display: none; 
      }
      .navbar a {
        white-space: nowrap;
        font-size: 13px;
        padding: 8px 16px;
      }
      h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="https://faruk90scinet.github.io/movie">Channel 1</a>
    <a href="https://faruk90scinet.github.io/movie/2">Channel 2</a>
    <a href="https://faruk90scinet.github.io/movie/3">Channel 3</a>
    <a href="https://faruk90scinet.github.io/movie/4">Channel 4</a>
    <a href="https://faruk90scinet.github.io/movie/5">Channel 5</a>
  </nav>

  <main class="content-grid">
    <div class="main-player-col">
      <div class="title-container">
        <h2 id="movie-title"><span class="brand-badge">FMZ</span> Loading...</h2>
      </div>
      <div class="video-wrapper" id="video-container">
        <!-- Video player automatically injected here -->
      </div>
    </div>

    <div class="sidebar-col" id="sidebar-container">
      <!-- Dynamic Sidebar links will be injected here -->
    </div>
  </main>

  <footer class="footer">
    <p>© Faruk's Movie Zone. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      
      const currentChannelId = "channel2"; 

      // Navigation Highlighting
      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const links = document.querySelectorAll(".navbar a");

      links.forEach(link => {
        const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
        if (linkUrl === currentUrl) {
          link.classList.add("active");
        }
      });

      function makeDirectLink(url) {
        if (!url) return '';
        return url.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "");
      }

      try {
        const response = await fetch('https://faruk90scinet.github.io/movie/movie-data.json');
        const allData = await response.json();
        const mainData = allData[currentChannelId];

        const videoSrc = makeDirectLink(mainData.videoLink);
        const subBn = makeDirectLink(mainData.subtitleBnLink);
        const subEn = makeDirectLink(mainData.subtitleEnLink);

        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">FMZ</span> ${mainData.title}`;

        // 1. BUILD MAIN PLAYER
        const videoHTML = `
          <div id="language-switcher-container"></div>
          <video id="main-video" controls crossorigin="anonymous" playsinline>          
            <source src="${videoSrc}" type="video/webm">
            <source src="${videoSrc}" type="video/mp4">
            ${subBn ? `<track kind="subtitles" src="${subBn}" srclang="bn" label="Bengali" default>` : ''}
            ${subEn ? `<track kind="subtitles" src="${subEn}" srclang="en" label="English">` : ''}
            Your browser does not support the video tag.
          </video>
        `;
        document.getElementById('video-container').innerHTML = videoHTML;

        // --- THE DECODING CODE ---
        const video = document.getElementById('main-video');
        
        video.addEventListener('loadedmetadata', function() {
          if (video.audioTracks && video.audioTracks.length > 1) {
            
            let switcherHTML = '<div class="language-switcher">';
            
            for (let i = 0; i < video.audioTracks.length; i++) {
              let track = video.audioTracks[i];
              let trackName = track.language ? track.language.toUpperCase() : `Language ${i + 1}`;
              let activeClass = track.enabled ? 'active' : '';
              
              switcherHTML += `
                <button class="lang-btn ${activeClass}" id="lang-btn-${i}" onclick="switchInternalAudio(${i})">
                  ${trackName} Audio
                </button>
              `;
            }
            switcherHTML += '</div>';
            document.getElementById('language-switcher-container').innerHTML = switcherHTML;
          } else {
            console.log("This browser does not support the audioTracks API or no extra tracks were found.");
          }
        });

        window.switchInternalAudio = function(trackIndex) {
          const tracks = document.getElementById('main-video').audioTracks;
          
          for (let i = 0; i < tracks.length; i++) {
            tracks[i].enabled = (i === trackIndex); 
            
            let btn = document.getElementById(`lang-btn-${i}`);
            if (i === trackIndex) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          }
        };
        // --- END DECODING CODE ---

        // 2. BUILD SIDEBAR
        const allChannelsList = ["channel1", "channel2", "channel3", "channel4", "channel5"];
        const sidebarChannels = allChannelsList.filter(ch => ch !== currentChannelId).slice(0, 3);
        
        let sidebarHTML = '';
        sidebarChannels.forEach(ch => {
          if (allData[ch]) {
            let channelLink = "https://faruk90scinet.github.io/movie";
            if (ch === "channel2") channelLink += "/2";
            if (ch === "channel3") channelLink += "/3";
            if (ch === "channel4") channelLink += "/4";
            if (ch === "channel5") channelLink += "/5";

            sidebarHTML += `
              <a href="${channelLink}" class="sidebar-item">
                <div class="sidebar-thumb">
                  <span class="play-icon">▶</span>
                </div>
                <div class="sidebar-title">${allData[ch].title}</div>
              </a>
            `;
          }
        });
        
        document.getElementById('sidebar-container').innerHTML = sidebarHTML;

      } catch (error) {
        console.error("Error loading movie data:", error);
        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">ERR</span> Unable to load movie data.`;
      }
    });
  </script>

</body>
</html>
