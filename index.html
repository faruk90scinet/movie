<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faruk's Movie Zone</title>
  <style>
    /* Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Amazon Prime Color Palette */
      --bg-color: #0f171e;           /* Deep Midnight Navy */
      --surface-color: rgba(27, 37, 48, 0.9); /* Lighter Navy for Navbar */
      --accent-color: #00a8e1;       /* Prime Cyan Blue */
      --accent-hover: #3397dd;
      --text-main: #ffffff;
      --text-muted: #8197a4;         /* Slate Grey/Blue */
      --border-color: #1f2d3d;
    }

    body {
      font-family: 'SolaimanLipi', 'Hind Siliguri', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at top, #1b2530 0%, var(--bg-color) 80%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism Navigation Bar */
    .navbar {
      background: var(--surface-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 6px; /* slightly squarer, more like Prime UI */
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .navbar a:hover {
      color: var(--text-main);
      background: rgba(0, 168, 225, 0.15); /* Faint blue hover */
    }

    .navbar a.active {
      color: #ffffff;
      background: var(--accent-color);
      box-shadow: 0 4px 12px rgba(0, 168, 225, 0.3);
    }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Cinematic Title */
    .title-container {
      width: 100%;
      text-align: left;
      margin-bottom: 25px;
      padding-left: 5px;
    }

    h2 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2 .brand {
      color: var(--accent-color);
      font-weight: 800;
    }

    /* Video Player Styling */
    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 
                  0 0 0 1px var(--border-color);
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block; 
      aspect-ratio: 16 / 9; 
      outline: none;
    }

    /* Subtitle Customization */
    video::cue {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-size: 1.3rem;
      font-family: 'SolaimanLipi', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* Footer styling */
    .footer {
      background: var(--bg-color);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }

    .footer .navbar {
      background: transparent;
      backdrop-filter: none;
      border: none;
      box-shadow: none;
      padding: 0;
      position: static;
    }

    .footer p {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .navbar {
        padding: 15px 10px;
        flex-wrap: nowrap;
        overflow-x: auto;
        justify-content: flex-start;
        -ms-overflow-style: none;
      }
      
      .navbar::-webkit-scrollbar {
        display: none; 
      }

      .navbar a {
        white-space: nowrap;
        font-size: 14px;
        padding: 8px 16px;
      }

      .main {
        padding: 30px 15px;
      }

      h2 {
        font-size: 22px;
      }
      
      .video-wrapper {
        border-radius: 8px;
      }
    }

    /* Loading Pulse Animation */
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="https://faruk90scinet.github.io/movie/">Channel 1</a>
    <a href="https://faruk90scinet.github.io/movie/2/">Channel 2</a>
    <a href="https://faruk90scinet.github.io/movie/3/">Channel 3</a>
    <a href="https://faruk90scinet.github.io/movie/4/">Channel 4</a>
  </nav>

  <main class="main">
    <div class="title-container">
      <h2 id="movie-title" class="pulse">🎬 Loading...</h2>
    </div>

    <div class="video-wrapper" id="video-container">
      <!-- Video player injected here -->
    </div>
  </main>

  <footer class="footer">
    <div class="navbar">
      <a href="https://faruk90scinet.github.io/movie/">Channel 1</a>
      <a href="https://faruk90scinet.github.io/movie/2/">Channel 2</a>
      <a href="https://faruk90scinet.github.io/movie/3/">Channel 3</a>
      <a href="https://faruk90scinet.github.io/movie/4/">Channel 4</a>
    </div>
    <p>© Faruk's Movie Zone. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      
      // ==========================================
      // SET CHANNEL ID HERE (channel1, channel2, channel3, channel4)
      // ==========================================
      const channelId = "channel1"; 

      // Navigation Highlighting
      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const topLinks = document.querySelectorAll("nav.navbar a");
      const bottomLinks = document.querySelectorAll(".footer .navbar a");

      function highlightLinks(links) {
        links.forEach(link => {
          const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
          if (linkUrl === currentUrl) {
            link.classList.add("active");
          }
        });
      }
      
      highlightLinks(topLinks);
      highlightLinks(bottomLinks);

      // Format standard Dropbox links into direct streams
      function makeDirectLink(url) {
        if (!url) return '';
        return url.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "");
      }

      // Load the movie dynamically from the master JSON file
      try {
        const response = await fetch('https://faruk90scinet.github.io/movie/movie-data.json');
        const allData = await response.json();
        const data = allData[channelId];

        // Format links
        const videoSrc = makeDirectLink(data.videoLink);
        const subBn = makeDirectLink(data.subtitleBnLink);
        const subEn = makeDirectLink(data.subtitleEnLink);

        // Update Title and remove pulse animation
        const titleEl = document.getElementById('movie-title');
        titleEl.classList.remove('pulse');
        titleEl.innerHTML = `<span class="brand">FMZ</span> | ${data.title}`;

        // Build Video Element
        const videoHTML = `
          <video controls crossorigin="anonymous" playsinline>          
            <source src="${videoSrc}" type="video/mp4">
            ${subBn ? `<track kind="subtitles" src="${subBn}" srclang="bn" label="Bengali" default>` : ''}
            ${subEn ? `<track kind="subtitles" src="${subEn}" srclang="en" label="English">` : ''}
            Your browser does not support the video tag.
          </video>
        `;
        
        document.getElementById('video-container').innerHTML = videoHTML;

      } catch (error) {
        console.error("Error loading movie data:", error);
        const titleEl = document.getElementById('movie-title');
        titleEl.classList.remove('pulse');
        titleEl.innerText = "⚠️ Error loading movie data.";
      }
    });
  </script>

</body>
</html>
