<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faruk's Movie Zone</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Premium Slate Color Palette */
      --bg-base: #13171A;        /* Deep Charcoal */
      --bg-glow: #1E2429;        /* Lighter Slate for the center */
      --glass-bg: rgba(30, 36, 41, 0.65);
      --glass-border: rgba(255, 255, 255, 0.06);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --accent: #00D2D3;         /* Sophisticated Cinematic Teal */
    }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-glow) 0%, var(--bg-base) 80%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Floating Navigation */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      margin: 30px auto;
      border-radius: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 90%;
      max-width: 700px;
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 24px;
      border-radius: 50px;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .navbar a:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .navbar a.active {
      color: var(--bg-base);
      background: var(--text-main);
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
    }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    /* Clean Video Container */
    .video-section {
      width: 100%;
      margin-bottom: 50px;
    }

    /* Elegant Title */
    .title-container {
      margin-bottom: 24px;
      padding-left: 8px;
    }

    h2 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
    }

    .brand-badge {
      color: var(--accent);
      font-weight: 600;
      margin-right: 12px;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid rgba(0, 210, 211, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0, 210, 211, 0.05);
    }

    /* Player Styling */
    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    video {
      width: 100%;
      height: auto;
      display: block; 
      aspect-ratio: 16 / 9; 
      outline: none;
    }

    /* Premium Subtitles */
    video::cue {
      background-color: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: 1.3rem;
      font-family: 'Hind Siliguri', sans-serif;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* Minimalist Footer */
    .footer {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      margin-top: auto;
    }

    .footer p {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .navbar {
        width: 92%;
        padding: 6px 8px;
        overflow-x: auto;
        justify-content: flex-start;
        -ms-overflow-style: none;
      }
      
      .navbar::-webkit-scrollbar {
        display: none; 
      }

      .navbar a {
        white-space: nowrap;
        font-size: 13px;
        padding: 8px 16px;
      }

      h2 {
        font-size: 18px;
      }

      .brand-badge {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Sleek Top Navigation -->
  <nav class="navbar">
    <a href="https://faruk90scinet.github.io/movie/">Channel 1</a>
    <a href="https://faruk90scinet.github.io/movie/2/">Channel 2</a>
    <a href="https://faruk90scinet.github.io/movie/3/">Channel 3</a>
    <a href="https://faruk90scinet.github.io/movie/4/">Channel 4</a>
    <a href="https://faruk90scinet.github.io/movie/5/">Channel 5</a>
  </nav>

  <main class="main">
    <div class="video-section">
      <div class="title-container">
        <h2 id="movie-title"><span class="brand-badge">FMZ</span> Loading...</h2>
      </div>

      <div class="video-wrapper" id="video-container">
        <!-- Video player automatically injected here -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© Faruk's Movie Zone. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      
      // ==========================================
      // SET CHANNEL ID HERE (channel1 to channel5)
      // ==========================================
      const channelId = "channel1"; 

      // Navigation Highlighting
      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const links = document.querySelectorAll("nav.navbar a");

      links.forEach(link => {
        const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
        if (linkUrl === currentUrl) {
          link.classList.add("active");
        }
      });

      // Format standard Dropbox links into direct streams
      function makeDirectLink(url) {
        if (!url) return '';
        return url.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "");
      }

      // Load the movie dynamically from the master JSON file
      try {
        const response = await fetch('https://faruk90scinet.github.io/movie/movie-data.json');
        const allData = await response.json();
        const data = allData[channelId];

        // Format links
        const videoSrc = makeDirectLink(data.videoLink);
        const subBn = makeDirectLink(data.subtitleBnLink);
        const subEn = makeDirectLink(data.subtitleEnLink);

        // Update Title
        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">FMZ</span> ${data.title}`;

        // Build Video Element
        const videoHTML = `
          <video controls crossorigin="anonymous" playsinline>          
            <source src="${videoSrc}" type="video/mp4">
            ${subBn ? `<track kind="subtitles" src="${subBn}" srclang="bn" label="Bengali" default>` : ''}
            ${subEn ? `<track kind="subtitles" src="${subEn}" srclang="en" label="English">` : ''}
            Your browser does not support the video tag.
          </video>
        `;
        
        document.getElementById('video-container').innerHTML = videoHTML;

      } catch (error) {
        console.error("Error loading movie data:", error);
        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">ERR</span> Unable to load movie data.`;
      }
    });
  </script>

</body>
</html>
