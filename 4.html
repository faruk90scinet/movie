<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faruk's Movie Zone</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Sony LIV Inspired Palette */
      --bg-base: #000000;
      --liv-gold: #FFC107;       /* Signature liv yellow/gold */
      --liv-cyan: #00E5FF;
      --liv-purple: #8A2BE2;
      --liv-orange: #FF4500;
      --glass-bg: rgba(15, 15, 20, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
    }

    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background-color: var(--bg-base);
      /* Vibrant background gradients inspired by the Sony LIV wave */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 69, 0, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Floating Navigation with Gradient Accent Border */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      /* Subtle gradient border at the bottom of the nav */
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--liv-cyan), var(--liv-purple), var(--liv-orange)) 1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      margin: 25px auto;
      border-radius: 8px; /* Sharper, app-like corners */
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 90%;
      max-width: 750px;
      position: sticky;
      top: 20px;
      z-index: 100;
    }

    .navbar a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 4px;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .navbar a:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .navbar a.active {
      color: #000000;
      background: var(--liv-gold);
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
    }

    /* Main Content Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    .video-section {
      width: 100%;
      margin-bottom: 50px;
    }

    /* Elegant Title */
    .title-container {
      margin-bottom: 20px;
      padding-left: 5px;
    }

    h2 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
    }

    .brand-badge {
      color: #000;
      background-color: var(--liv-gold);
      font-weight: 700;
      margin-right: 12px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      box-shadow: 0 2px 10px rgba(255, 193, 7, 0.3);
    }

    /* Player Styling */
    .video-wrapper {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      display: block; 
      aspect-ratio: 16 / 9; 
      outline: none;
    }

    /* Cinematic Subtitles */
    video::cue {
      background-color: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 1.3rem;
      font-family: 'Hind Siliguri', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,1);
    }

    /* Minimalist Footer */
    .footer {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      margin-top: auto;
      background: rgba(0, 0, 0, 0.4);
    }

    .footer p {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 300;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .navbar {
        width: 95%;
        padding: 8px;
        overflow-x: auto;
        justify-content: flex-start;
        -ms-overflow-style: none;
      }
      
      .navbar::-webkit-scrollbar {
        display: none; 
      }

      .navbar a {
        white-space: nowrap;
        font-size: 13px;
        padding: 8px 16px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sleek Top Navigation with specific URLs -->
  <nav class="navbar">
    <a href="https://faruk90scinet.github.io/movie">Channel 1</a>
    <a href="https://faruk90scinet.github.io/movie/2">Channel 2</a>
    <a href="https://faruk90scinet.github.io/movie/3">Channel 3</a>
    <a href="https://faruk90scinet.github.io/movie/4">Channel 4</a>
    <a href="https://faruk90scinet.github.io/movie/5">Channel 5</a>
  </nav>

  <main class="main">
    <div class="video-section">
      <div class="title-container">
        <h2 id="movie-title"><span class="brand-badge">FMZ</span> Loading...</h2>
      </div>

      <div class="video-wrapper" id="video-container">
        <!-- Video player automatically injected here -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© Faruk's Movie Zone. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      
      // ==========================================
      // SET CHANNEL ID HERE (channel1 to channel5)
      // ==========================================
      const channelId = "channel4"; 

      // Navigation Highlighting
      const currentUrl = window.location.href.split('?')[0].replace(/\/$/, ""); 
      const links = document.querySelectorAll("nav.navbar a");

      links.forEach(link => {
        const linkUrl = link.href.split('?')[0].replace(/\/$/, "");
        if (linkUrl === currentUrl) {
          link.classList.add("active");
        }
      });

      // Format standard Dropbox links into direct streams
      function makeDirectLink(url) {
        if (!url) return '';
        return url.replace("www.dropbox.com", "dl.dropboxusercontent.com").replace("?dl=0", "");
      }

      // Load the movie dynamically from the master JSON file
      try {
        const response = await fetch('https://faruk90scinet.github.io/movie/movie-data.json');
        const allData = await response.json();
        const data = allData[channelId];

        // Format links
        const videoSrc = makeDirectLink(data.videoLink);
        const subBn = makeDirectLink(data.subtitleBnLink);
        const subEn = makeDirectLink(data.subtitleEnLink);

        // Update Title
        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">FMZ</span> ${data.title}`;

        // Build Video Element
        const videoHTML = `
          <video controls crossorigin="anonymous" playsinline>          
            <source src="${videoSrc}" type="video/mp4">
            ${subBn ? `<track kind="subtitles" src="${subBn}" srclang="bn" label="Bengali" default>` : ''}
            ${subEn ? `<track kind="subtitles" src="${subEn}" srclang="en" label="English">` : ''}
            Your browser does not support the video tag.
          </video>
        `;
        
        document.getElementById('video-container').innerHTML = videoHTML;

      } catch (error) {
        console.error("Error loading movie data:", error);
        document.getElementById('movie-title').innerHTML = `<span class="brand-badge">ERR</span> Unable to load movie data.`;
      }
    });
  </script>

</body>
</html>
